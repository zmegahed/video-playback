<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Video Player Screen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #message {
      color: white;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      opacity: 0.45;
      text-align: center;
      padding: 40px;
    }

    #titleOverlay {
      position: fixed;
      left: 24px;
      bottom: 24px;
      color: white;
      background: rgba(0,0,0,0.55);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 20px;
      display: none;
      z-index: 2;
      max-width: calc(100vw - 48px);
      overflow-wrap: break-word;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: black;
      display: none;
    }
  </style>
</head>
<body>
  <div id="message">Player ready. Waiting for iPad command.</div>
  <div id="titleOverlay"></div>
  <video id="videoPlayer" autoplay playsinline></video>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const videoPlayer = document.getElementById("videoPlayer");
    const message = document.getElementById("message");
    const titleOverlay = document.getElementById("titleOverlay");

    let titleTimer = null;

    function clearTitleTimer() {
      if (titleTimer) {
        clearTimeout(titleTimer);
        titleTimer = null;
      }
    }

    function showMessage(text) {
      clearTitleTimer();

      videoPlayer.pause();
      videoPlayer.removeAttribute("src");
      videoPlayer.load();
      videoPlayer.style.display = "none";

      titleOverlay.textContent = "";
      titleOverlay.style.display = "none";

      message.innerText = text || "";
      message.style.display = "flex";
    }

    function showVideoTitle(label) {
      clearTitleTimer();

      if (!label) {
        titleOverlay.textContent = "";
        titleOverlay.style.display = "none";
        return;
      }

      titleOverlay.textContent = label;
      titleOverlay.style.display = "block";

      titleTimer = setTimeout(() => {
        titleOverlay.style.display = "none";
        titleTimer = null;
      }, 2500);
    }

    function safelyPlayVideo() {
      const playPromise = videoPlayer.play();

      if (playPromise !== undefined) {
        playPromise.catch((error) => {
          console.error(error);
          showMessage("Could not autoplay video. Click this player screen once, then try again from the iPad.");
        });
      }
    }

    socket.on("connect", () => {
      if (!videoPlayer.src) {
        message.innerText = "Player ready. Waiting for iPad command.";
        message.style.display = "flex";
      }
    });

    socket.on("disconnect", () => {
      if (!videoPlayer.src) {
        showMessage("Disconnected from controller server. Check Wi-Fi/server.");
      }
    });

    socket.on("playVideo", (video) => {
      if (!video || !video.url) {
        showMessage("Video command was missing a URL. Check videos.json.");
        return;
      }

      clearTitleTimer();

      message.style.display = "none";
      videoPlayer.style.display = "block";

      videoPlayer.pause();
      videoPlayer.src = video.url;
      videoPlayer.currentTime = 0;
      videoPlayer.load();

      showVideoTitle(video.label || "");

      safelyPlayVideo();
    });

    socket.on("blankScreen", () => {
      showMessage("");
    });

    socket.on("pauseVideo", () => {
      if (!videoPlayer.src) {
        return;
      }

      videoPlayer.pause();
    });

    socket.on("resumeVideo", () => {
      if (!videoPlayer.src) {
        return;
      }

      message.style.display = "none";
      videoPlayer.style.display = "block";
      safelyPlayVideo();
    });

    socket.on("resetVideo", () => {
      if (!videoPlayer.src) {
        showMessage("No video loaded. Choose a video from the iPad.");
        return;
      }

      videoPlayer.currentTime = 0;
      videoPlayer.pause();

      message.style.display = "none";
      videoPlayer.style.display = "block";
      showVideoTitle("Reset to beginning");
    });

    videoPlayer.addEventListener("ended", () => {
      showMessage("Video ended. Waiting for iPad command.");
    });

    videoPlayer.addEventListener("error", () => {
      showMessage("Could not load video. Check the video file path in videos.json.");
    });
  </script>
</body>
</html>
