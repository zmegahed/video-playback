<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Video Player Screen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
      cursor: none;
    }

    #message {
      color: white;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      opacity: 0.65;
      text-align: center;
      padding: 40px;
      line-height: 1.35;
      cursor: pointer;
    }

    #titleOverlay {
      position: fixed;
      left: 24px;
      bottom: 24px;
      color: white;
      background: rgba(0,0,0,0.55);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 20px;
      display: none;
      z-index: 2;
      max-width: calc(100vw - 48px);
      overflow-wrap: break-word;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: black;
      display: none;
    }
  </style>
</head>

<body>
  <div id="message">
    Player ready.<br>
    Click this screen once, then use the iPad.
  </div>

  <div id="titleOverlay"></div>
  <video id="videoPlayer" playsinline preload="auto"></video>

  <script>
    const videoPlayer = document.getElementById("videoPlayer");
    const message = document.getElementById("message");
    const titleOverlay = document.getElementById("titleOverlay");

    const pageOpenedAt = Date.now();
    let lastCommandId = null;
    let titleTimer = null;
    let pollTimer = null;
    let playerArmed = false;

    function clearTitleTimer() {
      if (titleTimer) {
        clearTimeout(titleTimer);
        titleTimer = null;
      }
    }

    function showMessage(text) {
      clearTitleTimer();

      videoPlayer.pause();
      videoPlayer.removeAttribute("src");
      videoPlayer.load();
      videoPlayer.style.display = "none";

      titleOverlay.textContent = "";
      titleOverlay.style.display = "none";

      message.innerHTML = text || "";
      message.style.display = "flex";
    }

    function showVideoTitle(label) {
      clearTitleTimer();

      if (!label) {
        titleOverlay.textContent = "";
        titleOverlay.style.display = "none";
        return;
      }

      titleOverlay.textContent = label;
      titleOverlay.style.display = "block";

      titleTimer = setTimeout(() => {
        titleOverlay.style.display = "none";
        titleTimer = null;
      }, 2500);
    }

    function safelyPlayVideo() {
      const playPromise = videoPlayer.play();

      if (playPromise !== undefined) {
        playPromise.catch((error) => {
          console.error(error);
          message.style.display = "flex";
          message.innerHTML = "Playback was blocked.<br>Click this laptop screen once, then press Resume on the iPad.";
        });
      }
    }

    function armPlayer() {
      playerArmed = true;

      if (!videoPlayer.src) {
        message.innerHTML = "Player armed.<br>Waiting for iPad command.";
        message.style.display = "flex";
      } else {
        message.style.display = "none";
        safelyPlayVideo();
      }

      startPolling();
    }

    document.body.addEventListener("click", armPlayer);

    function startPolling() {
      if (pollTimer) return;

      pollForCommands();
      pollTimer = setInterval(pollForCommands, 650);
    }

    async function pollForCommands() {
      try {
        const response = await fetch("/api/command?cacheBust=" + Date.now(), {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Command check failed.");
        }

        const result = await response.json();

        if (!result || !result.command) {
          return;
        }

        const command = result.command;

        if (!command.id || command.id === lastCommandId) {
          return;
        }

        const commandTime = command.createdAt ? new Date(command.createdAt).getTime() : Date.now();

        if (commandTime + 1000 < pageOpenedAt) {
          lastCommandId = command.id;
          return;
        }

        lastCommandId = command.id;
        applyCommand(command);
      } catch (error) {
        console.error(error);

        if (!videoPlayer.src) {
          message.innerHTML = "Waiting for controller connection...";
          message.style.display = "flex";
        }
      }
    }

    function applyCommand(command) {
      if (!command || !command.type) return;

      if (command.type === "play") {
        playVideo(command.video);
        return;
      }

      if (command.type === "blank") {
        showMessage("");
        return;
      }

      if (command.type === "pause") {
        if (!videoPlayer.src) return;
        videoPlayer.pause();
        return;
      }

      if (command.type === "resume") {
        if (!videoPlayer.src) return;
        message.style.display = "none";
        videoPlayer.style.display = "block";
        safelyPlayVideo();
        return;
      }

      if (command.type === "reset") {
        if (!videoPlayer.src) {
          showMessage("No video loaded.<br>Choose a video from the iPad.");
          return;
        }

        videoPlayer.pause();
        videoPlayer.currentTime = 0;
        message.style.display = "none";
        videoPlayer.style.display = "block";
        showVideoTitle("Reset to beginning");
      }
    }

    function playVideo(video) {
      if (!video || !video.url) {
        showMessage("Video command was missing a URL.<br>Check videos.json.");
        return;
      }

      clearTitleTimer();

      message.style.display = "none";
      videoPlayer.style.display = "block";

      videoPlayer.pause();
      videoPlayer.src = video.url;
      videoPlayer.currentTime = 0;
      videoPlayer.load();

      showVideoTitle(video.label || "");
      safelyPlayVideo();
    }

    videoPlayer.addEventListener("ended", () => {
      showMessage("Video ended.<br>Waiting for iPad command.");
    });

    videoPlayer.addEventListener("error", () => {
      showMessage("Could not load video.<br>Check the video file path in videos.json.");
    });

    setTimeout(() => {
      if (!playerArmed) {
        startPolling();
      }
    }, 1000);
  </script>
</body>
</html>
