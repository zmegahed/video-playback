<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>iPad Video Controller</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #111111;
      --card: #1b1b1b;
      --button: #2f80ed;
      --button-dark: #444444;
      --danger: #c0392b;
      --success: #27ae60;
      --text: #ffffff;
      --muted: #bbbbbb;
      --good: #8ee59f;
      --bad: #ffb3b3;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      user-select: none;
    }

    header {
      max-width: 1000px;
      margin: 0 auto 24px auto;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 34px;
    }

    .status {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.4;
      min-height: 22px;
    }

    .status.good { color: var(--good); }
    .status.bad { color: var(--bad); }

    .grid {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(130px, 1fr));
      gap: 16px;
    }

    button {
      font-size: 24px;
      font-weight: bold;
      padding: 28px 20px;
      border: 0;
      border-radius: 18px;
      background: var(--button);
      color: var(--text);
      cursor: pointer;
      min-height: 96px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      touch-action: manipulation;
    }

    button:active { transform: scale(0.98); }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .controls {
      max-width: 1000px;
      margin: 18px auto 0 auto;
      display: grid;
      grid-template-columns: repeat(4, minmax(100px, 1fr));
      gap: 16px;
    }

    .secondary {
      background: var(--button-dark);
      font-size: 21px;
      min-height: 76px;
    }

    .danger {
      background: var(--danger);
      font-size: 21px;
      min-height: 76px;
    }

    .smallControls {
      max-width: 1000px;
      margin: 16px auto 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .reload {
      background: var(--success);
      font-size: 18px;
      min-height: 66px;
      padding: 18px 16px;
    }

    .help {
      max-width: 1000px;
      margin: 24px auto 0 auto;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
      background: var(--card);
      padding: 16px;
      border-radius: 14px;
    }

    @media (max-width: 700px) {
      body { padding: 16px; }
      .grid, .controls { grid-template-columns: 1fr; }
      button { font-size: 22px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Video Controller</h1>
    <div class="status" id="status">Loading controller...</div>
  </header>

  <main>
    <section class="grid" id="videoButtons"></section>

    <section class="controls">
      <button class="secondary commandButton" type="button" onclick="sendCommand('pause')">Pause</button>
      <button class="secondary commandButton" type="button" onclick="sendCommand('resume')">Resume</button>
      <button class="secondary commandButton" type="button" onclick="sendCommand('reset')">Reset</button>
      <button class="danger commandButton" type="button" onclick="sendCommand('blank')">Blank Screen</button>
    </section>

    <section class="smallControls">
      <button class="reload" type="button" onclick="loadVideos()">Reload Video Buttons</button>
    </section>

    <section class="help">
      Open <strong>player.html</strong> on the laptop screen. Open <strong>controller.html</strong> on the iPad.
      <br><br>
      Both pages must use the same Vercel website URL. Click the laptop player once before starting.
    </section>
  </main>

  <script>
    const videoButtons = document.getElementById("videoButtons");
    const statusEl = document.getElementById("status");

    let isSending = false;

    function setStatus(text, mode) {
      statusEl.textContent = text;
      statusEl.className = "status";
      if (mode) statusEl.classList.add(mode);
    }

    function setCommandButtonsDisabled(disabled) {
      document.querySelectorAll(".commandButton").forEach((button) => {
        button.disabled = disabled;
      });
    }

    async function loadVideos() {
      try {
        setStatus("Loading video buttons...");

        const response = await fetch("/videos.json?cacheBust=" + Date.now(), {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("videos.json failed to load. Status: " + response.status);
        }

        const videos = await response.json();

        if (!Array.isArray(videos)) {
          throw new Error("videos.json must be an array.");
        }

        videoButtons.innerHTML = "";

        videos.forEach((video, index) => {
          if (!video || typeof video !== "object") {
            console.warn("Skipping video item " + index + ": item is not an object.");
            return;
          }

          if (typeof video.label !== "string" || typeof video.url !== "string" || !video.label || !video.url) {
            console.warn("Skipping video item " + index + ": missing label or url.");
            return;
          }

          const button = document.createElement("button");
          button.className = "commandButton";
          button.type = "button";
          button.textContent = video.label;
          button.onclick = () => sendCommand("play", video);
          videoButtons.appendChild(button);
        });

        const count = videoButtons.children.length;

        if (count === 0) {
          setStatus("No valid videos found. Check videos.json.", "bad");
        } else {
          setStatus(count + " video button(s) ready.", "good");
        }
      } catch (error) {
        console.error(error);
        setStatus("Could not load videos.json. Check commas, quotes, label, and url.", "bad");
      }
    }

    async function sendCommand(type, video) {
      if (isSending) return;

      try {
        isSending = true;
        setCommandButtonsDisabled(true);
        setStatus("Sending command...");

        const response = await fetch("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          cache: "no-store",
          body: JSON.stringify({
            type,
            video: video || null
          })
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(result.error || "Command failed.");
        }

        if (type === "play") {
          setStatus("Playing: " + (video.label || "Untitled video"), "good");
        } else if (type === "pause") {
          setStatus("Paused.", "good");
        } else if (type === "resume") {
          setStatus("Resumed.", "good");
        } else if (type === "reset") {
          setStatus("Reset video to beginning.", "good");
        } else if (type === "blank") {
          setStatus("Screen blanked.", "good");
        } else {
          setStatus("Command sent.", "good");
        }
      } catch (error) {
        console.error(error);
        setStatus("Command failed. Refresh both pages and try again.", "bad");
      } finally {
        isSending = false;
        setCommandButtonsDisabled(false);
      }
    }

    loadVideos();
  </script>
</body>
</html>
