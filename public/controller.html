<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>iPad Video Controller</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <style>
    :root {
      --text: #f7f8fb;
      --muted: rgba(247,248,251,0.68);
      --soft: rgba(247,248,251,0.46);
      --glass: rgba(255,255,255,0.12);
      --glass-strong: rgba(255,255,255,0.18);
      --stroke: rgba(255,255,255,0.18);
      --shadow: 0 18px 48px rgba(0,0,0,0.32);
      --blue: rgba(10,132,255,0.78);
      --gray: rgba(120,120,128,0.42);
      --red: rgba(255,69,58,0.74);
      --green: rgba(48,209,88,0.72);
      --good: #8ef0a1;
      --bad: #ffb3ad;
      --radius-xl: 28px;
      --radius-lg: 22px;
      --button-height: 92px;
      --small-button-height: 72px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background:
        radial-gradient(circle at 15% 10%, rgba(10,132,255,0.36), transparent 30%),
        radial-gradient(circle at 85% 0%, rgba(191,90,242,0.28), transparent 28%),
        radial-gradient(circle at 50% 100%, rgba(48,209,88,0.16), transparent 32%),
        linear-gradient(145deg, #0b0f18 0%, #151824 48%, #07080d 100%);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Arial, sans-serif;
      color: var(--text);
      padding: max(22px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      user-select: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(0.2px);
    }

    .app {
      width: min(100%, 1080px);
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .titleBlock {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1;
      letter-spacing: -0.04em;
      font-weight: 760;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.35;
    }

    .statusPill {
      flex: 0 0 auto;
      max-width: 360px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px 16px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--stroke);
      box-shadow: 0 8px 28px rgba(0,0,0,0.18);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      color: var(--muted);
      font-size: 15px;
      line-height: 1.25;
    }

    .statusPill.good { color: var(--good); }
    .statusPill.bad { color: var(--bad); }

    .dashboard {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 16px;
      align-items: start;
    }

    .stack {
      display: grid;
      gap: 16px;
    }

    .widget {
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.08));
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      backdrop-filter: blur(28px) saturate(170%);
      -webkit-backdrop-filter: blur(28px) saturate(170%);
      overflow: hidden;
    }

    .widgetHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px 16px 0 16px;
    }

    .widgetTitle {
      margin: 0;
      font-size: 15px;
      line-height: 1;
      font-weight: 720;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
    }

    .widgetHint {
      color: var(--soft);
      font-size: 13px;
      white-space: nowrap;
    }

    .widgetBody {
      padding: 16px;
    }

    .buttonGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .controlGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    button {
      width: 100%;
      min-height: var(--button-height);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: var(--radius-lg);
      color: var(--text);
      font-family: inherit;
      font-size: 21px;
      line-height: 1.15;
      font-weight: 720;
      letter-spacing: -0.02em;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 24px rgba(0,0,0,0.22);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      transition: transform 120ms ease, opacity 120ms ease, filter 120ms ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 14px 16px;
    }

    button:active {
      transform: scale(0.975);
      filter: brightness(1.08);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    #videoButtons button {
      background: linear-gradient(145deg, rgba(10,132,255,0.86), rgba(10,132,255,0.56));
    }

    .secondary {
      background: linear-gradient(145deg, rgba(142,142,147,0.48), rgba(99,99,102,0.34));
    }

    .danger {
      background: linear-gradient(145deg, rgba(255,69,58,0.84), rgba(255,69,58,0.54));
    }

    .reload {
      min-height: var(--small-button-height);
      background: linear-gradient(145deg, rgba(48,209,88,0.82), rgba(48,209,88,0.50));
      font-size: 19px;
    }

    .helpText {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.48;
    }

    .helpText strong {
      color: rgba(255,255,255,0.9);
      font-weight: 720;
    }

    @media (max-width: 860px) {
      header {
        align-items: stretch;
        flex-direction: column;
      }

      .statusPill {
        max-width: none;
        justify-content: flex-start;
        text-align: left;
      }

      .dashboard {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      body { padding: 14px; }
      .buttonGrid,
      .controlGrid {
        grid-template-columns: 1fr;
      }
      button {
        min-height: 78px;
        font-size: 20px;
      }
      .reload {
        min-height: 68px;
      }
      .widgetHeader {
        align-items: flex-start;
        flex-direction: column;
      }
      .widgetHint {
        white-space: normal;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="titleBlock">
        <h1>Video Controller</h1>
        <div class="subtitle">iPad controls for the laptop display</div>
      </div>
      <div class="statusPill" id="status">Loading controller...</div>
    </header>

    <main class="dashboard">
      <section class="widget">
        <div class="widgetHeader">
          <h2 class="widgetTitle">Videos</h2>
          <div class="widgetHint">Tap to play</div>
        </div>
        <div class="widgetBody">
          <div class="buttonGrid" id="videoButtons"></div>
        </div>
      </section>

      <div class="stack">
        <section class="widget">
          <div class="widgetHeader">
            <h2 class="widgetTitle">Controls</h2>
          </div>
          <div class="widgetBody">
            <div class="controlGrid">
              <button class="secondary commandButton" type="button" onclick="sendCommand('pause')">Pause</button>
              <button class="secondary commandButton" type="button" onclick="sendCommand('resume')">Resume</button>
              <button class="secondary commandButton" type="button" onclick="sendCommand('reset')">Reset</button>
              <button class="danger commandButton" type="button" onclick="sendCommand('blank')">Blank Screen</button>
            </div>
          </div>
        </section>

        <section class="widget">
          <div class="widgetHeader">
            <h2 class="widgetTitle">System</h2>
          </div>
          <div class="widgetBody">
            <button class="reload" type="button" onclick="loadVideos()">Reload Video Buttons</button>
          </div>
        </section>

        <section class="widget">
          <div class="widgetHeader">
            <h2 class="widgetTitle">Setup</h2>
          </div>
          <div class="widgetBody">
            <p class="helpText">
              Open <strong>player.html</strong> on the laptop screen. Open <strong>controller.html</strong> on the iPad.
              <br><br>
              Both pages must use the same Vercel website URL. Click the laptop player once before starting.
            </p>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const videoButtons = document.getElementById("videoButtons");
    const statusEl = document.getElementById("status");

    let isSending = false;

    function setStatus(text, mode) {
      statusEl.textContent = text;
      statusEl.className = "statusPill";
      if (mode) statusEl.classList.add(mode);
    }

    function setCommandButtonsDisabled(disabled) {
      document.querySelectorAll(".commandButton").forEach((button) => {
        button.disabled = disabled;
      });
    }

    async function loadVideos() {
      try {
        setStatus("Loading video buttons...");

        const response = await fetch("/videos.json?cacheBust=" + Date.now(), {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("videos.json failed to load. Status: " + response.status);
        }

        const videos = await response.json();

        if (!Array.isArray(videos)) {
          throw new Error("videos.json must be an array.");
        }

        videoButtons.innerHTML = "";

        videos.forEach((video, index) => {
          if (!video || typeof video !== "object") {
            console.warn("Skipping video item " + index + ": item is not an object.");
            return;
          }

          if (typeof video.label !== "string" || typeof video.url !== "string" || !video.label || !video.url) {
            console.warn("Skipping video item " + index + ": missing label or url.");
            return;
          }

          const button = document.createElement("button");
          button.className = "commandButton";
          button.type = "button";
          button.textContent = video.label;
          button.onclick = () => sendCommand("play", video);
          videoButtons.appendChild(button);
        });

        const count = videoButtons.children.length;

        if (count === 0) {
          setStatus("No valid videos found. Check videos.json.", "bad");
        } else {
          setStatus(count + " video button(s) ready.", "good");
        }
      } catch (error) {
        console.error(error);
        setStatus("Could not load videos.json. Check commas, quotes, label, and url.", "bad");
      }
    }

    async function sendCommand(type, video) {
      if (isSending) return;

      try {
        isSending = true;
        setCommandButtonsDisabled(true);
        setStatus("Sending command...");

        const response = await fetch("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          cache: "no-store",
          body: JSON.stringify({
            type,
            video: video || null
          })
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(result.error || "Command failed.");
        }

        if (type === "play") {
          setStatus("Playing: " + (video.label || "Untitled video"), "good");
        } else if (type === "pause") {
          setStatus("Paused.", "good");
        } else if (type === "resume") {
          setStatus("Resumed.", "good");
        } else if (type === "reset") {
          setStatus("Reset video to beginning.", "good");
        } else if (type === "blank") {
          setStatus("Screen blanked.", "good");
        } else {
          setStatus("Command sent.", "good");
        }
      } catch (error) {
        console.error(error);
        setStatus("Command failed. Refresh both pages and try again.", "bad");
      } finally {
        isSending = false;
        setCommandButtonsDisabled(false);
      }
    }

    loadVideos();
  </script>
</body>
</html>
